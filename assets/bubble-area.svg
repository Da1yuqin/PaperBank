<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">Bubble size: encode quantity by area, not radius</title>
<desc id="desc">Synthetic example. Not paper results. Reproducible using the accompanying Python source.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="45.000" y="42.000" font-size="25" text-anchor="start" fill="#27343E">Bubble size: encode quantity by area, not radius</text>
<text x="45.000" y="72.000" font-size="18" text-anchor="start" fill="#BA7D73">Synthetic example / Not paper results</text>
<text x="270.000" y="113.000" font-size="17" text-anchor="middle" fill="#27343E">A  Radius proportional to value</text>
<text x="270.000" y="176.000" font-size="18" text-anchor="middle" fill="#27343E">Area ratio = 1 : 16 : 81</text>
<circle cx="160.000" cy="320.000" r="6" fill="#567F9C" fill-opacity="0.75"/>
<text x="160.000" y="423.000" font-size="17" text-anchor="middle" fill="#27343E">v = 1</text>
<circle cx="270.000" cy="320.000" r="24" fill="#567F9C" fill-opacity="0.75"/>
<text x="270.000" y="423.000" font-size="17" text-anchor="middle" fill="#27343E">v = 4</text>
<circle cx="380.000" cy="320.000" r="54" fill="#567F9C" fill-opacity="0.75"/>
<text x="380.000" y="423.000" font-size="17" text-anchor="middle" fill="#27343E">v = 9</text>
<text x="270.000" y="482.000" font-size="16" text-anchor="middle" fill="#27343E">Area exaggerates the value ratios</text>
<text x="270.000" y="520.000" font-size="17" text-anchor="middle" fill="#27343E">r = 6 × v pixels</text>
<text x="660.000" y="113.000" font-size="17" text-anchor="middle" fill="#27343E">B  Area proportional to value</text>
<text x="660.000" y="176.000" font-size="18" text-anchor="middle" fill="#27343E">Area ratio = 1 : 4 : 9</text>
<circle cx="550.000" cy="320.000" r="18.0" fill="#659386" fill-opacity="0.75"/>
<text x="550.000" y="423.000" font-size="17" text-anchor="middle" fill="#27343E">v = 1</text>
<circle cx="660.000" cy="320.000" r="36.0" fill="#659386" fill-opacity="0.75"/>
<text x="660.000" y="423.000" font-size="17" text-anchor="middle" fill="#27343E">v = 4</text>
<circle cx="770.000" cy="320.000" r="54.0" fill="#659386" fill-opacity="0.75"/>
<text x="770.000" y="423.000" font-size="17" text-anchor="middle" fill="#27343E">v = 9</text>
<text x="660.000" y="482.000" font-size="16" text-anchor="middle" fill="#27343E">Area preserves the value ratios</text>
<text x="660.000" y="520.000" font-size="17" text-anchor="middle" fill="#27343E">r = 18 × √v pixels</text>
<text x="45.000" y="558.000" font-size="14" text-anchor="start" fill="#27343E">Synthetic quantities v = 1, 4, 9; both panels give the largest circle a radius of 54 pixels.</text>
<text x="45.000" y="579.000" font-size="14" text-anchor="start" fill="#27343E">Circle area = πr². Horizontal position only arranges the examples; it encodes no second quantity.</text>
</g>
</svg>
