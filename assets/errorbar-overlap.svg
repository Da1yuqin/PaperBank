<text x="270.000" y="531.000" font-size="16" text-anchor="middle" fill="#27343E">SD bars overlap</text>
<text x="690.000" y="531.000" font-size="16" text-anchor="middle" fill="#27343E">SE bars do not overlap</text>
<text x="45.000" y="558.000" font-size="14" text-anchor="start" fill="#27343E">Same samples in both panels: A = [1, 3, 5, 7, 9]; B = [5, 7, 9, 11, 13].</text>
<text x="45.000" y="579.000" font-size="14" text-anchor="start" fill="#27343E">SD = √10; SE = √2. Neither panel supplies a p-value or a test of the mean difference.</text>
