<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">实验绘图：同一数据，补全比较口径</title>
<desc id="desc">优化前：两柱使用60与66的相同比例，颜色难辨，图例遮挡且没有单位和数值。优化后：准确率坐标从0至100，注明60和66，差值6个百分点，相对提高10%，无误差条。教学示意，非原论文修订记录。</desc>
<style>text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#69737D" stroke-width="1.6"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M -2 2 L 2 -2 M 0 9 L 9 0 M 7 11 L 11 7" stroke="#4D7463" stroke-width="1.3"/></pattern></defs>
<rect width="960" height="680" fill="white"/>
<text x="28" y="35" text-anchor="start" font-weight="bold" fill="#28313A">实验绘图：同一数据，补全比较口径</text>
<rect x="28" y="60" width="440" height="534" rx="14" fill="#FAFAFC" stroke="#DFE3E7"/>
<rect x="492" y="60" width="440" height="534" rx="14" fill="#FAFAFC" stroke="#DFE3E7"/>
<text x="50" y="95" text-anchor="start" font-weight="bold" fill="#28313A">优化前</text>
<text x="514" y="95" text-anchor="start" font-weight="bold" fill="#386A9D">优化后</text>
<text x="248" y="139" text-anchor="middle" font-weight="normal" fill="#69737D">缺单位、数值与清楚图例</text>
