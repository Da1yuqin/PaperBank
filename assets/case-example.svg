<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc"><title id="title">案例图按信息来源分栏</title><desc id="desc">证据、候选回答与人工核对三个分栏，用蓝色高亮年份和动作词，区分开放与扩建。</desc><rect width="920" height="300" fill="#fff"/><g font-family="system-ui, sans-serif" fill="#364152"><text x="28" y="34" font-size="18" font-weight="600">原创教学案例 · 假设文本，不代表真实记录</text><g fill="#fff" stroke="#ccd4e0"><rect x="28" y="60" width="272" height="166" rx="6"/><rect x="323" y="60" width="272" height="166" rx="6"/><rect x="618" y="60" width="272" height="166" rx="6"/></g><g font-size="17" font-weight="600"><text x="44" y="90">输入证据</text><text x="339" y="90">候选回答</text><text x="634" y="90">人工核对</text></g><g fill="#e9effb"><rect x="106" y="116" width="148" height="26" rx="3"/><rect x="106" y="157" width="148" height="26" rx="3"/><rect x="435" y="116" width="100" height="26" rx="3"/></g><g font-size="16"><text x="44" y="135">出处 A：</text><text x="111" y="135">2019 年开放</text><text x="44" y="176">出处 B：</text><text x="111" y="176">2021 年扩建</text><text x="339" y="135">“场馆于 2021 年</text><text x="339" y="169">首次开放。”</text><text x="634" y="135">答案混淆了两种事件。</text><text x="634" y="169">开放时间来自 A；</text><text x="634" y="198">扩建时间来自 B。</text></g><text x="28" y="262" font-size="14" fill="#667085">高亮：需要核对的年份与动作；分栏：信息来源。不给教学案例伪造评分或总体成功率。</text></g></svg>
