<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc"><title id="title">同一个案例沿流程变化</title><desc id="desc">上方显示问题、证据检索、冲突核验、带出处回答四个步骤，下方显示每步的教学中间产物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#687588"/></marker></defs><rect width="920" height="320" fill="#fff"/><g font-family="system-ui, sans-serif" fill="#364152"><text x="28" y="34" font-size="18" font-weight="600">原创教学布局 · 示例内容，不代表模型输出</text><g fill="#eef2f8" stroke="#c9d2df"><rect x="28" y="65" width="172" height="70" rx="7"/><rect x="257" y="65" width="172" height="70" rx="7"/><rect x="486" y="65" width="172" height="70" rx="7"/><rect x="715" y="65" width="172" height="70" rx="7"/></g><g text-anchor="middle" font-size="18" font-weight="600"><text x="114" y="107">输入问题</text><text x="343" y="107">检索证据</text><text x="572" y="107">核验冲突</text><text x="801" y="107">输出回答</text></g><g stroke="#687588" stroke-width="2" marker-end="url(#arrow)"><path d="M205 100H246"/><path d="M434 100H475"/><path d="M663 100H704"/></g><g stroke="#ccd4e0" stroke-dasharray="4 4"><path d="M114 139V166"/><path d="M343 139V166"/><path d="M572 139V166"/><path d="M801 139V166"/></g><g font-size="15" text-anchor="middle"><text x="114" y="188">A、B 结论一致吗？</text><text x="343" y="188">片段 A：2019 年开放</text><text x="343" y="214">片段 B：2021 年扩建</text><text x="572" y="188">“开放”与“扩建”</text><text x="572" y="214">是不同事件</text><text x="801" y="188">分别说明两个事件</text><text x="801" y="214">保留出处 A / B</text></g><path d="M28 251H887" stroke="#e1e5eb"/><text x="28" y="281" font-size="14" fill="#667085">实线箭头：数据传递；虚线：该步骤的案例说明。箭头不表示已验证的因果关系。</text></g></svg>
